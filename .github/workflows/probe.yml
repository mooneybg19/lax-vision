name: probe games

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Probe videos and grab sample frames
        run: python3 pipeline/probe.py results/probe
      - name: Save
        run: |
          git config user.name "lax-pipeline"
          git config user.email "lax-pipeline@users.noreply.github.com"
          git add results
          git commit -m "Probe: video checks and sample frames [skip ci]" || echo "nothing to commit"
          git pull --rebase origin main
          git push
