name: settled-offense frames

on:
  workflow_dispatch:
    inputs:
      game:
        description: "game file name in games/ (no .json)"
        default: "scituate-hanover-2024"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install numpy opencv-python-headless
      - name: Pull frames
        run: python pipeline/frames.py games/${{ inputs.game }}.json results/${{ inputs.game }}-sets results/${{ inputs.game }}-frames
      - name: Save
        run: |
          git config user.name "lax-pipeline"
          git config user.email "lax-pipeline@users.noreply.github.com"
          git add results
          git commit -m "Settled-offense frames: ${{ inputs.game }} [skip ci]" || echo "nothing to commit"
          git pull --rebase origin main
          git push
