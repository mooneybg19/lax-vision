name: label frames

on:
  workflow_dispatch:
    inputs:
      per_game: { description: "frames per game", default: "45" }
      batch: { description: "batch number (new seed)", default: "0" }

permissions:
  contents: write

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        game: [scituate-hanover-2024, anne-arundel-carroll-2021, stillwater-bsm-2025, jesuit-westview]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python3 pipeline/label_frames.py out ${{ inputs.per_game }} ${{ matrix.game }} ${{ inputs.batch }}
      - uses: actions/upload-artifact@v4
        with: { name: "frames-${{ matrix.game }}", path: out }
  save:
    needs: grab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dl, pattern: "frames-*", merge-multiple: true }
      - run: |
          mkdir -p results/label_frames && cp -n dl/*.jpg results/label_frames/
          ls results/label_frames | wc -l
          git config user.name "lax-pipeline"
          git config user.email "lax-pipeline@users.noreply.github.com"
          git add results/label_frames
          git commit -m "Real frames for landmark labeling [skip ci]" || echo "nothing to commit"
          git pull --rebase origin main
          git push
