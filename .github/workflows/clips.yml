name: moment clips

on:
  workflow_dispatch:
    inputs:
      game:
        description: "game file name in games/ (no .json)"
        default: "scituate-hanover-2024"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Cut clips
        run: python pipeline/clips.py games/${{ inputs.game }}.json results/${{ inputs.game }}-sets/moments.json clips
      - uses: actions/upload-artifact@v4
        with:
          name: clips-${{ inputs.game }}
          path: clips
          retention-days: 14
      - name: Hand clips over on a throwaway branch (deleted after download; never merged)
        run: |
          cd clips
          git init -q -b clips-transfer
          git config user.name "lax-pipeline"
          git config user.email "lax-pipeline@users.noreply.github.com"
          git add . && git commit -q -m "Clips: ${{ inputs.game }} [skip ci]"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" clips-transfer
